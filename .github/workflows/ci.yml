name: Java CI - Auto Grade

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  checks: write
  actions: read
  contents: read

# =============================================================
# SCORING BREAKDOWN (Total: 100 pts)
#   ① Build compiles successfully     : 20 pts
#   ② All unit tests pass             : 40 pts
#   ③ Code coverage (JaCoCo, linear)  : 20 pts
#   ④ Required docs (5 files, >300B)  : 10 pts
#   ⑤ AI_AUDIT_LOG has entries        : 10 pts
# =============================================================

jobs:

  # ────────────────────────────────────────────
  # JOB ① — BUILD  (20 pts)
  # ────────────────────────────────────────────
  grade-build:
    name: "① Build — 20 pts"
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.score.outputs.score }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile source code
        id: compile
        run: mvn compile --no-transfer-progress
        continue-on-error: true

      - name: Calculate score
        id: score
        if: always()
        run: |
          if [ "${{ steps.compile.outcome }}" = "success" ]; then
            SCORE=20; STATUS="✅ PASS"
          else
            SCORE=0;  STATUS="❌ FAIL"
          fi
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          {
            echo "## ① Build: $SCORE / 20 pts — $STATUS"
            echo ""
            if [ $SCORE -eq 20 ]; then
              echo "> Code compiled successfully."
            else
              echo "> Build failed. Check compile errors in the step above."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Propagate failure
        if: steps.compile.outcome == 'failure'
        run: exit 1

  # ────────────────────────────────────────────
  # JOB ② — UNIT TESTS  (40 pts)
  # ────────────────────────────────────────────
  grade-tests:
    name: "② Unit Tests — 40 pts"
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.score.outputs.score }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        id: tests
        run: mvn test --no-transfer-progress
        continue-on-error: true

      - name: Calculate score
        id: score
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            SCORE=40; STATUS="✅ PASS"
          else
            SCORE=0;  STATUS="❌ FAIL"
          fi
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          {
            echo "## ② Unit Tests: $SCORE / 40 pts — $STATUS"
            echo ""
            if [ $SCORE -eq 40 ]; then
              echo "> All unit tests passed."
            else
              echo "> Some tests failed. Run \`mvn test\` locally to debug."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Propagate failure
        if: steps.tests.outcome == 'failure'
        run: exit 1

  # ────────────────────────────────────────────
  # JOB ③ — CODE COVERAGE  (20 pts, proportional)
  # ────────────────────────────────────────────
  grade-coverage:
    name: "③ Coverage — 20 pts"
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.score.outputs.score }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo
        run: mvn test jacoco:report --no-transfer-progress
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Calculate score
        id: score
        if: always()
        run: |
          SCORE=0
          PCT="0.0"
          if [ -f target/site/jacoco/jacoco.xml ]; then
            COVERED=$(grep -oP 'type="LINE"[^/]*/>' target/site/jacoco/jacoco.xml \
                      | grep -oP 'covered="\K[0-9]+' | awk '{s+=$1}END{print s}')
            MISSED=$(grep -oP  'type="LINE"[^/]*/>' target/site/jacoco/jacoco.xml \
                      | grep -oP 'missed="\K[0-9]+'  | awk '{s+=$1}END{print s}')
            COVERED=${COVERED:-0}
            MISSED=${MISSED:-0}
            TOTAL=$((COVERED + MISSED))
            if [ $TOTAL -gt 0 ]; then
              PCT=$(echo "scale=1; $COVERED * 100 / $TOTAL" | bc)
              SCORE=$(echo "scale=0; $COVERED * 20 / $TOTAL" | bc)
            fi
          fi
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          {
            echo "## ③ Coverage: $SCORE / 20 pts (${PCT}% line coverage)"
            echo ""
            echo "| Coverage | Points earned |"
            echo "|:--------:|:-------------:|"
            echo "| 100%     | 20 pts        |"
            echo "| 80%      | 16 pts        |"
            echo "| 50%      | 10 pts        |"
            echo "| 0%       | 0 pts         |"
            echo ""
            echo "> **Your result: ${PCT}% → $SCORE / 20 pts**"
          } >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # JOB ④ — REQUIRED DOCS  (10 pts)
  # ────────────────────────────────────────────
  grade-docs:
    name: "④ Required Docs — 10 pts"
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.score.outputs.score }}

    steps:
      - uses: actions/checkout@v4

      - name: Calculate score
        id: score
        if: always()
        run: |
          FILES=(README.md AI_AUDIT_LOG.md PROMPTS.md REFLECTION.md CHANGELOG.md)
          TOTAL=${#FILES[@]}
          PRESENT=0
          TABLE=""
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              SIZE=$(wc -c < "$FILE")
              if [ "$SIZE" -gt 300 ]; then
                PRESENT=$((PRESENT + 1))
                TABLE="${TABLE}\n| \`$FILE\` | ✅ OK (${SIZE} bytes) |"
              else
                TABLE="${TABLE}\n| \`$FILE\` | ⚠️ Too short (${SIZE} bytes, need >300) |"
              fi
            else
              TABLE="${TABLE}\n| \`$FILE\` | ❌ Not found |"
            fi
          done
          SCORE=$(echo "scale=0; $PRESENT * 10 / $TOTAL" | bc)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          {
            echo "## ④ Required Docs: $SCORE / 10 pts ($PRESENT/$TOTAL files OK)"
            echo ""
            echo "| File | Status |"
            echo "|------|--------|"
            printf "$TABLE\n"
          } >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # JOB ⑤ — AI AUDIT LOG  (10 pts)
  # ────────────────────────────────────────────
  grade-ailog:
    name: "⑤ AI Audit Log — 10 pts"
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.score.outputs.score }}

    steps:
      - uses: actions/checkout@v4

      - name: Calculate score
        id: score
        if: always()
        run: |
          SCORE=0
          ENTRIES=0
          if [ -f "AI_AUDIT_LOG.md" ]; then
            RAW=$(grep -c "^|" AI_AUDIT_LOG.md || true)
            ENTRIES=$((RAW - 2))
            [ $ENTRIES -lt 0 ] && ENTRIES=0
            [ $ENTRIES -gt 0 ] && SCORE=10
          fi
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          {
            echo "## ⑤ AI Audit Log: $SCORE / 10 pts"
            echo ""
            if [ $SCORE -eq 10 ]; then
              echo "> ✅ Found $ENTRIES entries in AI_AUDIT_LOG.md"
            else
              echo "> ❌ AI_AUDIT_LOG.md is empty or missing. Remember to log every AI interaction."
            fi
          } >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # FINAL — SCORE REPORT
  # ────────────────────────────────────────────
  score-report:
    name: "🏆 Final Score"
    runs-on: ubuntu-latest
    needs: [grade-build, grade-tests, grade-coverage, grade-docs, grade-ailog]
    if: always()

    steps:
      - name: Calculate and display total score
        run: |
          S1="${{ needs.grade-build.outputs.score }}";    S1=${S1:-0}
          S2="${{ needs.grade-tests.outputs.score }}";    S2=${S2:-0}
          S3="${{ needs.grade-coverage.outputs.score }}"; S3=${S3:-0}
          S4="${{ needs.grade-docs.outputs.score }}";     S4=${S4:-0}
          S5="${{ needs.grade-ailog.outputs.score }}";    S5=${S5:-0}
          TOTAL=$((S1 + S2 + S3 + S4 + S5))

          if   [ $TOTAL -ge 90 ]; then GRADE="A (Xuất sắc)"
          elif [ $TOTAL -ge 80 ]; then GRADE="B (Giỏi)"
          elif [ $TOTAL -ge 70 ]; then GRADE="C (Khá)"
          elif [ $TOTAL -ge 60 ]; then GRADE="D (Trung bình)"
          else                         GRADE="F (Chưa đạt)"
          fi

          {
            echo "---"
            echo "# 🏆 TỔNG ĐIỂM: $TOTAL / 100 — $GRADE"
            echo ""
            echo "| # | Hạng mục | Điểm của bạn | Điểm tối đa |"
            echo "|:-:|----------|:------------:|:-----------:|"
            echo "| ① | Build (biên dịch)         | $S1 | 20  |"
            echo "| ② | Unit Tests (kiểm thử)     | $S2 | 40  |"
            echo "| ③ | Coverage (độ phủ test)    | $S3 | 20  |"
            echo "| ④ | Required Docs (tài liệu)  | $S4 | 10  |"
            echo "| ⑤ | AI Audit Log              | $S5 | 10  |"
            echo "|   | **TỔNG**                  | **$TOTAL** | **100** |"
            echo ""
            if   [ $TOTAL -ge 90 ]; then echo "> 🎉 Xuất sắc! Bạn đã hoàn thành rất tốt bài lab này."
            elif [ $TOTAL -ge 70 ]; then echo "> 💪 Tốt! Xem lại các hạng mục chưa đạt điểm tối đa để cải thiện."
            elif [ $TOTAL -ge 60 ]; then echo "> 📚 Cần cố gắng thêm. Xem chi tiết từng job bên trên để biết cần sửa gì."
            else                         echo "> ❗ Chưa đạt yêu cầu. Hãy đọc kỹ hướng dẫn và thử lại."
            fi
          } >> $GITHUB_STEP_SUMMARY
